spring.application.name=EmployeeTaskManagerSpring

spring.datasource.url=jdbc:h2:mem:employeedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# The dialect is detected automatically from the H2 driver.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=false

# Development console is not bundled and must never be enabled in production.
spring.h2.console.enabled=false
